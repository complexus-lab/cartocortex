name: Sign release

# Signs the installers of a published release with the Complexus Lab Ed25519
# key, the same key that signs Rouvre releases and its bundle index. The
# workflow lists every asset with its SHA-256 digest in SHA256SUMS, signs that
# file, attaches both to the release, and copies them to
# https://complexuslab.fr/cartocortex/releases/<tag>/ so that the signature can
# be checked against a host other than GitHub. See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release to sign, for example v0.1.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sign-release
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Check the tag
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }

    - name: Download the installers
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir assets
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
        # A release signed before keeps its old list; it is replaced below.
        rm -f assets/SHA256SUMS assets/SHA256SUMS.sig
        test -n "$(ls assets)" || { echo "::error::Release $TAG has no assets"; exit 1; }
        ls -l assets

    - name: Sign
      env:
        SIGNING_KEY: ${{ secrets.COMPLEXUS_LAB_SIGNING_KEY }}
      run: |
        set -euo pipefail
        test -n "$SIGNING_KEY" || { echo "::error::The release environment has no COMPLEXUS_LAB_SIGNING_KEY secret"; exit 1; }
        key="$RUNNER_TEMP/signing.pem"
        umask 077
        printf '%s\n' "$SIGNING_KEY" > "$key"
        # The key must match the public key published in this repository.
        openssl pkey -in "$key" -pubout | cmp - keys/release-signing.pub.pem
        (cd assets && LC_ALL=C sha256sum -- *) > SHA256SUMS
        openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
        rm -f "$key"
        openssl pkeyutl -verify -pubin -inkey keys/release-signing.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
        cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" SHA256SUMS SHA256SUMS.sig --repo "$GITHUB_REPOSITORY" --clobber

    - name: Check the site credentials
      env:
        HAS_TOKEN: ${{ secrets.SITE_TOKEN != '' }}
      run: |
        if [ "$HAS_TOKEN" != true ]; then
          echo "::error::The release environment needs SITE_TOKEN to publish to the site repository"
          exit 1
        fi

    - name: Check out the site
      uses: actions/checkout@v4
      with:
        repository: complexus-lab/complexus-lab-site
        token: ${{ secrets.SITE_TOKEN }}
        path: site

    - name: Publish the signed list
      run: |
        set -euo pipefail
        dir="site/cartocortex/releases/$TAG"
        mkdir -p "$dir"
        cp SHA256SUMS SHA256SUMS.sig "$dir/"
        cd site
        git add cartocortex/releases
        if git diff --cached --quiet; then
          echo "Signed list unchanged"
          exit 0
        fi
        git -c user.name="Cartocortex release signing" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -m "Publish the signed checksums of Cartocortex $TAG" -m "Generated by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        for i in 1 2 3; do
          git push origin HEAD:main && exit 0
          git pull --rebase origin main
        done
        exit 1
